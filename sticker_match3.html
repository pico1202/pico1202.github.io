<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>工地兄弟 · 貼圖三消</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#07060f;font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;color:#f6ead0;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block}
#hud{position:fixed;left:50%;top:10px;transform:translateX(-50%);width:min(94vw,640px);display:grid;grid-template-columns:repeat(4,1fr);gap:8px;pointer-events:none}
.box{background:linear-gradient(180deg,rgba(60,30,10,.75),rgba(25,12,6,.75));border:1px solid rgba(240,190,90,.55);border-radius:12px;padding:6px 8px;text-align:center;box-shadow:0 4px 18px rgba(0,0,0,.5),inset 0 0 12px rgba(255,200,90,.12)}
.box small{display:block;font-size:11px;letter-spacing:.2em;color:#e8c27a}
.box b{display:block;font:800 clamp(16px,4.2vw,24px)/1.2 "Segoe UI",system-ui,sans-serif;color:#fff6dc;text-shadow:0 0 10px rgba(255,190,80,.6)}
#prog{grid-column:1/-1;height:8px;border-radius:6px;background:rgba(0,0,0,.45);border:1px solid rgba(240,190,90,.35);overflow:hidden}
#prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff5a2a,#ffd54a,#20e3a0,#8c6cff);transition:width .4s;box-shadow:0 0 10px #ffd54a}
#bar{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:8px}
#bar button{font:700 14px/1 inherit;font-family:inherit;color:#2a1504;background:linear-gradient(180deg,#ffe3a0,#e0a83a);border:1px solid #fff2c8;border-radius:10px;padding:10px 16px;cursor:pointer;box-shadow:0 3px 0 #8a5a12,0 6px 16px rgba(0,0,0,.5);letter-spacing:.08em}
#bar button{white-space:nowrap}
@media (max-width:480px){#bar{gap:6px;bottom:max(10px,env(safe-area-inset-bottom))}#bar button{padding:9px 11px;font-size:13px}}
#bar button:active{transform:translateY(2px);box-shadow:0 1px 0 #8a5a12}
#ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,3,10,.6);backdrop-filter:blur(3px)}
#ov.on{display:flex}
#ov .card{text-align:center;padding:28px 36px;border-radius:18px;background:linear-gradient(180deg,rgba(70,36,12,.95),rgba(26,12,6,.95));border:2px solid #e8b860;box-shadow:0 0 40px rgba(255,190,80,.35)}
#ov h2{font:900 40px/1.2 "DFKai-SB","BiauKai","標楷體","KaiTi","STKaiti",serif;color:#ffe6a8;text-shadow:0 0 18px #ff9a30;letter-spacing:.15em}
#ov p{margin:12px 0 18px;color:#f3dcb0;line-height:1.7}
#ov button{font:700 16px/1 inherit;font-family:inherit;color:#2a1504;background:linear-gradient(180deg,#ffe3a0,#e0a83a);border:0;border-radius:10px;padding:12px 26px;cursor:pointer}
</style>
</head>
